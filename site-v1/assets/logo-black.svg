t><text transform="matrix(1 0 0 1 -179 60.1572)" display="inline" fill="#ffffff" font-family="'Helvetica-Bold'" font-size="3">Strokes</text><text transform="matrix(1 0 0 1 -179 65.1572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">Try to keep strokes at 4px</text><text transform="matrix(1 0 0 1 -179 70.1572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">Minimum stroke weight is 2px</text><text transform="matrix(1 0 0 1 -179 74.6572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">For thicker strokes use even </text><text transform="matrix(1 0 0 1 -179 77.6572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">numbers: 6px, 8px etc.</text><text transform="matrix(1 0 0 1 -179 82.1572)" display="inline" fill="#ffffff" font-family="'Helvetica-Bold'" font-size="2.4">Remember to expand strokes </text><text transform="matrix(1 0 0 1 -179 85.1572)" display="inline" fill="#ffffff" font-family="'Helvetica-Bold'" font-size="2.4">before saving as an SVG </text><rect x="-136.5" y="58" display="inline" fill="none" width="35" height="32.5"></rect><text transform="matrix(1 0 0 1 -136.5 60.1572)" display="inline" fill="#ffffff" font-family="'Helvetica-Bold'" font-size="3">Size</text><text transform="matrix(1 0 0 1 -136.5 65.1572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">Cannot be wider or taller than </text><text transform="matrix(1 0 0 1 -136.5 68.6572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">100px (artboard size)</text><text transform="matrix(1 0 0 1 -136.5 73.6572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">Scale your icon to fill as much of </text><text transform="matrix(1 0 0 1 -136.5 76.6572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">the artboard as possible</text><rect x="-94" y="58" display="inline" fill="none" width="35" height="32.5"></rect><text transform="matrix(1 0 0 1 -94 60.1572)" display="inline" fill="#ffffff" font-family="'Helvetica-Bold'" font-size="3">Ungroup</text><text transform="matrix(1 0 0 1 -94 65.1572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">If your design has more than one </text><text transform="matrix(1 0 0 1 -94 68.1572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">shape, make sure to ungroup</text><rect x="-50" y="58" display="inline" fill="none" width="35" height="32.5"></rect><text transform="matrix(1 0 0 1 -50 60.1572)" display="inline" fill="#ffffff" font-family="'Helvetica-Bold'" font-size="3">Save as</text><text transform="matrix(1 0 0 1 -50 65.1572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">Save as .SVG and make sure </text><text transform="matrix(1 0 0 1 -50 68.1572)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.4">“Use Artboards” is checked</text><text transform="matrix(1.0074 0 0 1 -125.542 30.5938)" display="inline" fill="#ffffff" font-family="'Helvetica'" font-size="2.5731">100px</text><text transform="matrix(1.0074 0 0 1 -41 39)" display="inline" fill="#ffffff" font-family="'Helvetica-Bold'" font-size="5.1462">.SVG</text><rect x="-126.514" y="34.815" display="inline" fill="#ffffff" width="10.261" height="10.185"></rect><rect x="-126.477" y="31.766" display="inline" fill="#ffffff" width="0.522" height="2.337"></rect><rect x="-116.812" y="31.766" display="inline" fill="#ffffff" width="0.523" height="2.337"></rect><rect x="-127" y="32.337" display="inline" fill="#ffffff" width="11.233" height="0.572"></rect><g display="inline"><rect x="-83.805" y="33.844" fill="#ffffff" width="10.305" height="10.156"></rect><rect x="-76.809" y="28.707" fill="#ffffff" width="3.308" height="3.261"></rect></g><rect x="-178.5" y="22.5" display="inline" fill="#ffffff" stroke="#ffffff" stroke-miterlimit="10" width="30" height="30"></rect><rect x="-136.5" y="22.5"